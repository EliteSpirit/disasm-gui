name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install ruff pytest capstone pefile pyelftools

      - name: Lint
        run: ruff check .

      # на Linux-раннере нет дисплея, поэтому GUI только компилируем; запуск окна — в job windows
      - name: Byte-compile GUI
        run: python -m compileall -q gui.py

      - name: Tests
        run: python -m pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Tests
        run: python -m pytest -q

      - name: GUI smoke test
        run: python tests/smoke_gui.py C:\Windows\System32\notepad.exe
