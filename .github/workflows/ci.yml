name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 — нижняя граница из README, 3.13 — свежая
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          command -v xvfb-run || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)
          pip install -r requirements.txt ruff pytest

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

      # дисплея на раннере нет, поэтому окно открываем на виртуальном (Xvfb)
      - name: GUI smoke test
        run: xvfb-run -a python tests/smoke_gui.py /bin/ls

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Tests
        run: python -m pytest -q

      - name: GUI smoke test
        run: python tests/smoke_gui.py C:\Windows\System32\notepad.exe
