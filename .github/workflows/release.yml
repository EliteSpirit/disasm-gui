name: Release

# Два способа выпустить релиз:
#   1. Actions -> Release -> Run workflow, вписать версию (например v0.1.0);
#      тег на текущем main поставится сам.
#   2. Запушить тег: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # версию берём из env, а не подставляем ${{ }} прямо в скрипт: так её текст не может
      # стать частью команды
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      # проверяем до сборки: с «v1.0-rc1» version_file.py упал бы только после тестов
      - name: Check version
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Версия должна быть вида v1.2.3, а пришло: $VERSION"
            exit 1
          fi

      # токен с правом записи не оставляем в .git/config: дальше ставятся и запускаются
      # сторонние пакеты, а релиз публикует action ниже со своим токеном
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest pyinstaller

      - name: Tests
        run: python -m pytest -q

      # настоящий запуск окна на Windows: открыть notepad.exe, прокрутить, перейти по call
      - name: GUI smoke test
        run: python tests/smoke_gui.py C:\Windows\System32\notepad.exe

      - name: Build exe
        run: |
          python tools/version_file.py $env:VERSION > version.txt
          python -m PyInstaller --noconfirm --onefile --windowed --name DisasmGUI --version-file version.txt --collect-all customtkinter --collect-all capstone gui.py

      # Подпись через SignPath Foundation. Шаги ниже пропускаются, пока в
      # Settings -> Secrets and variables -> Actions не заведены переменная
      # SIGNPATH_ORGANIZATION_ID и секрет SIGNPATH_API_TOKEN (их выдают после
      # одобрения заявки). Каждую подпись нужно вручную подтвердить в SignPath.
      - name: Upload unsigned exe
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: DisasmGUI-unsigned
          path: dist/DisasmGUI.exe

      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: disasm-gui
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist\DisasmGUI.exe -Algorithm SHA256).Hash.ToLower() + "  DisasmGUI.exe" | Out-File -Encoding ascii dist\DisasmGUI.exe.sha256

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Disasm GUI ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/DisasmGUI.exe
            dist/DisasmGUI.exe.sha256
